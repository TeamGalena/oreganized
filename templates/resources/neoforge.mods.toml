modLoader = "javafml"
loaderVersion = "[1,)"
license = "https://github.com/${repository}/blob/HEAD/LICENSE.md"
issueTrackerURL = "https://github.com/${repository}/issues/"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = "{{ moduleName }} module of {{ baseModName }}"
{% block mod %}{% endblock %}

{% for module in moduleDependencies %}
[[dependencies.${mod_id}]]
modId = "{{ baseModId }}_{{ module }}"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
{% endfor %}
