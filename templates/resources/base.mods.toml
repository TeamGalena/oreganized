loaderVersion = "[1,)"
license = "https://github.com/${repository}/blob/HEAD/LICENSE.md"
issueTrackerURL = "https://github.com/${repository}/issues/"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_author}"
logoFile = "icon.png"
logoBlur = false
credits = "Thanks to our wonderful Patreon members and those who help participate in discussions on our Discord server!"
updateJSONURL = "https://api.modrinth.com/updates/{{ slug }}/forge_updates.json?neoforge=only"
displayURL = "https://modrinth.com/mod/{{ slug }}"
{% block mod %}{% endblock %}
{% for module in moduleDependencies %}

[[dependencies.${mod_id}]]
modId = "{{ baseModId }}_{{ module }}"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
{% endfor %}
