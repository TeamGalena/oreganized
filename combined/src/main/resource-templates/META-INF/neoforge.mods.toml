modLoader = "lowcodefml"
{% embed "base.mods.toml" %}
{% block mod %}
updateJSONURL = "https://api.modrinth.com/updates/${mod_id}/forge_updates.json?neoforge=only"
displayURL = "https://www.curseforge.com/minecraft/mc-mods/${mod_id}"
logoFile = "${mod_id}.png"
itemIcon = "${mod_id}:silver_ore"
configBackground = "${mod_id}:textures/block/glance_bricks.png"
credits = "Thanks to our wonderful Patreon members and those who help participate in discussions on our Discord server!"
description = '''
Oreganized is a mod focusing on adding new ores and metals to Minecraft. Currently it adds, Lead and Silver as base metals and a new alloy known as Electrum.

This mod is designed to be a Vanilla plus mod while also adding unique uses and abilities to its content rather than just meaningless toolsets for a more engaging experience that tries to match the quality of Mojang's own implementations of new content.
'''
{% endblock %}
{% endembed %}
